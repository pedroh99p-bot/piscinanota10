const VideoPlayer = () => {
  const videoRef = useRef(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const [isMuted, setIsMuted] = useState(true);

  const togglePlay = () => {
    if (videoRef.current) {
      if (isPlaying) videoRef.current.pause();
      else videoRef.current.play();
      setIsPlaying(!isPlaying);
    }
  };

  const toggleMute = () => {
    if (videoRef.current) {
      videoRef.current.muted = !isMuted;
      setIsMuted(!isMuted);
    }
  };

  return (
    <motion.div variants={scaleUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} className="relative w-full max-w-sm mx-auto aspect-[4/5] rounded-[2.5rem] overflow-hidden shadow-2xl border border-white/20 dark:border-white/10 group bg-slate-900 z-10">
      <video ref={videoRef} src={VIDEO_URL} className="w-full h-full object-cover cursor-pointer" loop playsInline muted={isMuted} onClick={togglePlay}></video>
      <div className="absolute top-6 right-6 z-20">
        <button onClick={toggleMute} className={`w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-colors ${isPlaying ? 'opacity-0 hover:opacity-100' : 'opacity-100'}`}>
          {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}

const AnimatedCounter = ({ target, label }) => {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const isInView = useInView(ref, { once: true, amount: 0.5 });

  useEffect(() => {
    if (isInView) {
      let start = 0;
      const duration = 2000;
      const incrementTime = duration / target;
      const timer = setInterval(() => {
        start += 1;
        setCount(start);
        if (start >= target) clearInterval(timer);
      }, incrementTime);
      return () => clearInterval(timer);
    }
  }, [target, isInView]);

  return (
    <div ref={ref} className="flex flex-col items-center justify-center p-3 md:p-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md rounded-xl md:rounded-2xl border border-slate-200/50 dark:border-white/10 shadow-sm w-full">
      <span className="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-blue-600 dark:from-cyan-400 dark:to-cyan-200 mb-1">+{count}</span>
      <span className="text-[9px] md:text-xs font-bold text-slate-500 uppercase tracking-widest text-center leading-tight">{label}</span>
    </div>
  );
};

              <div className="testimonial-track gap-6 md:gap-8 px-4">
                {CAROUSEL_ITEMS.map((item, index) => (
                  <div key={index} className="shrink-0 w-[85vw] md:w-[450px] bg-white dark:bg-slate-950 rounded-[2.5rem] border border-slate-200 dark:border-white/5 shadow-md flex flex-col overflow-hidden relative">
                    
                    <div className="w-full h-48 md:h-56 relative overflow-hidden bg-slate-900 border-b border-slate-200 dark:border-white/5">
                       {/* Background Blurred para dar preenchimento premium nos prints verticais */}
                       <img src={item.img} className="absolute inset-0 w-full h-full object-cover blur-xl opacity-40 scale-110" alt="" />
                       <img src={item.img} className="relative w-full h-full object-contain pt-2" alt={`Depoimento ${item.name}`} />
                       
                       <div className="absolute top-4 left-4 z-10 bg-slate-900/90 dark:bg-black/60 backdrop-blur-sm px-4 py-1.5 rounded-full text-[10px] font-black uppercase text-white shadow-sm border border-slate-700 dark:border-white/10">
                         Caso Real
                       </div>
                    </div>

                    <div className="p-6 md:p-8 flex flex-col flex-1">
                      <div className="flex gap-1 text-amber-400 mb-4">
                        {[1,2,3,4,5].map(star => <Star key={star} className="w-4 h-4 md:w-5 md:h-5 fill-current" />)}
                      </div>
                      <p className="text-slate-700 dark:text-slate-300 italic mb-6 font-medium text-sm md:text-base leading-relaxed">"{item.text}"</p>
                      
                      <div className="mt-auto pt-4 border-t border-slate-200 dark:border-white/10 flex items-center gap-4">
                        <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-cyan-100 dark:bg-cyan-900/30 flex items-center justify-center text-cyan-600 dark:text-cyan-400 font-black text-lg md:text-xl">
                          {item.name.charAt(0)}
                        </div>
                        <div>
                           <p className="font-bold text-slate-900 dark:text-white text-sm md:text-base">{item.name}</p>
                           <p className="text-[10px] md:text-xs text-slate-500 font-bold uppercase tracking-wider">{item.neighborhood} • {item.service}</p>
                        </div>
                      </div>
                    </div>

                  </div>
                ))}
              </div>
            </div>
          </section>

          <OrganicWaveBottom fill="fill-white dark:fill-slate-950" />

          {/* --- MAP SECTION --- */}
          <section className="py-24 relative bg-white dark:bg-slate-950 z-10">
            <div className="absolute inset-0 z-0 opacity-100 dark:opacity-40 mix-blend-multiply dark:mix-blend-screen" style={{ backgroundImage: `url(${TEXTURA_BRANCA})`, backgroundRepeat: 'repeat', backgroundSize: '300px' }}></div>
            <div className="absolute inset-0 z-0 bg-white/45 dark:bg-slate-950/70 backdrop-blur-[2px]"></div>
            
            <div className="container mx-auto px-6 relative z-10 grid lg:grid-cols-2 gap-12 items-center">
              
              <motion.div variants={fadeInUp} initial="hidden" whileInView="visible" viewport={{ once: true, margin: "-50px" }} className="flex flex-col items-start text-left">
                <div className="w-16 h-16 bg-cyan-100 dark:bg-cyan-900/30 rounded-[2rem] flex items-center justify-center mb-8 border border-cyan-200 dark:border-cyan-900/50 shadow-sm">
                   <MapPin className="w-8 h-8 text-cyan-600 dark:text-cyan-400" />
                </div>
                <h2 className="text-4xl md:text-5xl font-black mb-6 text-slate-900 dark:text-white leading-tight">Estrutura de Rota.</h2>
                <p className="text-lg text-slate-600 dark:text-slate-400 font-medium mb-10 leading-relaxed max-w-lg">
                  Atuamos com rotas operacionais consolidadas abrangendo Barra da Tijuca, Recreio, Zona Sul e Grande Tijuca, focando na regularidade dos processos.
                </p>
                <div className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                  <Button href={getWhatsAppLink("Olá, solicito alinhamento para avaliação técnica no meu endereço.")} variant="whatsapp" icon={WhatsAppIcon} className="py-4 px-8 text-base">
                    Solicitar Avaliação
                  </Button>
                  <Button href={getWhatsAppLink("Olá, gostaria de checar a malha de atendimento no meu bairro.")} variant="outlineDark" icon={MapPin} className="py-4 px-8 text-base">
                    Verificar Área Atendida
                  </Button>
                </div>
              </motion.div>

              <motion.div variants={scaleUp} initial="hidden" whileInView="visible" viewport={{ once: true, margin: "-50px" }} className="w-full max-w-md mx-auto lg:max-w-full h-[250px] lg:h-[350px] rounded-[3rem] overflow-hidden border-[6px] border-white dark:border-slate-800 shadow-2xl relative bg-slate-100 dark:bg-slate-900">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d117565.41829631773!2d-43.43577315!3d-22.9463583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9bda4e526484e5%3A0x6ce6b50f952f4eb2!2sRio%20de%20Janeiro%2C%20RJ!5e0!3m2!1spt-BR!2sbr!4v1700000000000!5m2!1spt-BR!2sbr"
                  className="absolute inset-0 w-full h-full grayscale-[20%] contrast-125 dark:invert dark:hue-rotate-180"
                  style={{ border: 0 }}
                  allowFullScreen=""
                  loading="lazy"
                  referrerPolicy="no-referrer-when-downgrade"
                  title="Mapa Rio de Janeiro"
                ></iframe>
                <div className="absolute inset-0 pointer-events-none rounded-[3rem] shadow-[inset_0_0_40px_rgba(0,0,0,0.1)]"></div>
              </motion.div>

            </div>
          </section>

          {/* --- FINAL ROLLER --- */}
          <div className="py-4 bg-cyan-700 dark:bg-cyan-900 text-white overflow-hidden flex items-center shadow-md">
             <Marquee text="GARANTA SUA VAGA • ATENDIMENTO ESPECIALIZADO NO RJ • " className="text-xs md:text-sm font-bold uppercase tracking-widest" reverse={true} />
          </div>

          {/* --- FINAL OFFER --- */}
          <section className="py-32 relative flex items-center justify-center overflow-hidden">
            <div className="absolute inset-0 z-0">
               <img src={IMAGEM_HERO} alt="Fundo Piscina" className="w-full h-full object-cover object-center" />
               <div className="absolute inset-0 bg-blue-950/85 mix-blend-multiply"></div>
               <div className="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent opacity-95"></div>
            </div>
            
            <div className="container mx-auto px-6 max-w-4xl relative z-10 text-center flex flex-col items-center">
              <motion.img variants={fadeInUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} src={LOGO_PRINCIPAL} alt="Piscina NOTA10" className="h-16 md:h-20 mb-8 object-contain brightness-0 invert opacity-90 drop-shadow-lg" />
              
              <motion.h2 variants={fadeInUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} className="text-4xl md:text-6xl font-black text-white mb-6 tracking-tight drop-shadow-md leading-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-100 to-white animate-gradient-text">
                Agende uma avaliação técnica e entenda o que sua piscina realmente precisa
              </motion.h2>
              <motion.p variants={fadeInUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} className="text-xl md:text-2xl text-cyan-100/90 mb-10 max-w-2xl mx-auto font-medium leading-relaxed">
                Atendimento organizado, análise completa e plano ideal para manter sua piscina sempre pronta para uso.
              </motion.p>

              <motion.div variants={scaleUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} className="mb-10 flex flex-col sm:flex-row items-center gap-6">
                <div className="inline-flex items-center gap-3 px-5 py-2.5 rounded-full border border-red-500/30 bg-red-500/10 backdrop-blur-md shadow-sm">
                  <AlertTriangle className="w-5 h-5 text-red-400" />
                  <span className="font-bold text-red-100 text-sm md:text-base tracking-wide">Agenda técnica controlada por região no RJ</span>
                </div>
              </motion.div>
              
              <motion.div variants={fadeInUp} initial="hidden" whileInView="visible" viewport={{ once: true, amount: 0.2 }} className="flex flex-col sm:flex-row gap-4 w-full sm:w-auto p-2 bg-white/5 backdrop-blur-md rounded-[2rem] border border-white/10 shadow-2xl">
                <Button href={getWhatsAppLink("Olá, quero agendar uma avaliação técnica para a minha piscina.")} variant="whatsapp" className="w-full sm:w-auto text-lg px-8 py-4" icon={WhatsAppIcon}>
                  Agendar visita técnica
                </Button>
                <Button href={getWhatsAppLink("Olá, gostaria de alinhar diretrizes sobre a manutenção da minha piscina.")} variant="outline" className="w-full sm:w-auto text-lg px-8 py-4 border-red-500/40 text-red-100 hover:bg-red-500/10" icon={WhatsAppIcon}>
                  Alinhar via WhatsApp
                </Button>
              </motion.div>
            </div>
          </section>

          {/* --- FOOTER --- */}
          <footer className="bg-slate-950 pt-24 pb-12 border-t border-white/10">
            <div className="container mx-auto px-6">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-12 lg:gap-16 mb-20">
                
                <div className="md:col-span-5 flex flex-col items-start">
                  <img src={LOGO_PRINCIPAL} alt="Piscina NOTA10" className="h-12 mb-8 object-contain brightness-0 invert opacity-90" />
                  <p className="text-slate-400 text-sm mb-8 leading-relaxed max-w-md font-medium">
                    Atuação com rigor técnico para piscinas no Rio de Janeiro. Nosso processo otimiza e cuida de forma sistêmica da sua área de lazer.
                  </p>
                  <div className="flex gap-4">
                    <a href={INSTAGRAM_URL} target="_blank" rel="noopener noreferrer" className="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:bg-white/10 transition-all border border-white/10">
                      <Instagram className="w-5 h-5" />
                    </a>
                    <a href={getWhatsAppLink("Olá, busco suporte técnico.")} target="_blank" rel="noopener noreferrer" className="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center text-slate-300 hover:text-[#25D366] hover:bg-white/10 transition-all border border-white/10">
                      <WhatsAppIcon className="w-5 h-5" />
                    </a>
                  </div>
                </div>
                
                <div className="md:col-span-3">
                  <h4 className="text-white font-bold mb-8 uppercase tracking-widest text-xs">Acesso Direto</h4>
                  <ul className="space-y-4 text-sm text-slate-400 font-medium">
                    <li><button onClick={()=>scrollTo('servicos')} className="hover:text-cyan-400 transition-colors">Portfólio Modular</button></li>
                    <li><button onClick={()=>scrollTo('quiz')} className="hover:text-cyan-400 transition-colors">Avaliação Diagnóstica</button></li>
                    <li><a href={INSTAGRAM_URL} target="_blank" className="hover:text-cyan-400 transition-colors">Acompanhamento Diário</a></li>
                  </ul>
                </div>

                <div className="md:col-span-4">
                  <h4 className="text-white font-bold mb-8 uppercase tracking-widest text-xs">Canais Oficiais</h4>
                  <ul className="space-y-5 text-sm text-slate-400 font-medium">
                    <li className="flex items-center gap-3">
                       <div className="w-8 h-8 rounded-full bg-cyan-900/30 flex items-center justify-center flex-shrink-0"><WhatsAppIcon className="w-4 h-4 text-cyan-400"/></div>
                       +55 21 98535-5807
                    </li>
                    <li className="flex items-center gap-3">
                       <div className="w-8 h-8 rounded-full bg-cyan-900/30 flex items-center justify-center flex-shrink-0"><MapPin className="w-4 h-4 text-cyan-400"/></div>
                       Rotas Otimizadas RJ
                    </li>
                  </ul>
                </div>

              </div>
              
              <div className="pt-8 border-t border-white/10 text-center text-xs text-slate-500 flex flex-col md:flex-row justify-between items-center gap-6 font-medium uppercase tracking-wider">
                <p>© {new Date().getFullYear()} Piscina NOTA10. Direitos Reservados à marca e operação técnica.</p>
              </div>
            </div>
          </footer>

        </motion.div>
      </div>
    </div>
  );
}
const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
